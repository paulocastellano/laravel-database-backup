name: tests

on:
  push:
    branches:
      - main
      - '*.x'
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest]
        php: [8.3, 8.4, 8.5]
        laravel: [12.*, 13.*]
        stability: [prefer-lowest, prefer-stable]
        include:
          - laravel: 12.*
            testbench: 10.*
          - laravel: 13.*
            testbench: 11.*

    name: P${{ matrix.php }} - L${{ matrix.laravel }} - ${{ matrix.stability }} - ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, fileinfo, sqlite, pdo_sqlite, bcmath, intl
          ini-values: error_reporting=E_ALL
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction --no-progress --no-scripts
          composer run prepare

      - name: PHPStan
        run: composer analyse

      - name: Linter
        run: composer lint:check

      - name: Type Coverage
        if: runner.os != 'Windows'
        run: composer test:types

      - name: Test Suite
        if: runner.os != 'Windows'
        run: composer test:unit

      - name: Test Suite (Windows)
        if: runner.os == 'Windows'
        run: vendor/bin/pest

  databases:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true
      matrix:
        include:
          - connection: pgsql
            image: postgres:16
            port: 5432
            username: postgres
            health: '--health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=5'
          - connection: mysql
            image: mysql:8.4
            port: 3306
            username: root
            health: '--health-cmd="mysqladmin ping -h 127.0.0.1 -u root -ppassword" --health-interval=10s --health-timeout=5s --health-retries=5'

    name: Real dump and restore - ${{ matrix.connection }}

    services:
      database:
        image: ${{ matrix.image }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: testing
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: testing
        ports:
          - ${{ matrix.port }}
        options: ${{ matrix.health }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: 8.5
          extensions: dom, curl, libxml, mbstring, zip, fileinfo, pdo_pgsql, pdo_mysql, bcmath, intl
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        run: |
          composer update --prefer-stable --prefer-dist --no-interaction --no-progress --no-scripts
          composer run prepare

      - name: Test Suite
        run: vendor/bin/pest
        env:
          DB_CONNECTION: ${{ matrix.connection }}
          DB_HOST: 127.0.0.1
          DB_PORT: ${{ job.services.database.ports[matrix.port] }}
          DB_DATABASE: testing
          DB_USERNAME: ${{ matrix.username }}
          DB_PASSWORD: password
